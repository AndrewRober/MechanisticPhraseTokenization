[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanistic-phrase-tokenization"
version = "1.0.0"
description = "Mechanistic Multi-Word Vocabulary Allocation, Compositional-Residual Folding, Prefix-Cone Decoding, and Test-Time Compute Gearshifting for LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Andrew Rober Fouad Samy", email = "andrew.rober@bytesglue.com" }
]
keywords = [
  "llm",
  "tokenization",
  "bpe",
  "superbpe",
  "transformer",
  "pretraining",
  "mechanistic-interpretability",
  "test-time-compute",
  "pytorch",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.1.0",
  "numpy>=1.24.0",
  "tokenizers>=0.15.0",
  "huggingface_hub>=0.20.0",
]

[project.urls]
Homepage = "https://andrewrober.github.io/papers/mechanistic-phrase-tokenization/"
Repository = "https://github.com/AndrewRober/MechanisticPhraseTokenization"
"HuggingFace Models" = "https://huggingface.co/AndrewR123/MechanisticPhraseTokenization"
"Interactive Space" = "https://huggingface.co/spaces/AndrewR123/Superword-Tokenizer-Playground"
Paper = "https://andrewrober.github.io/papers/mechanistic-phrase-tokenization.pdf"

[tool.setuptools]
package-dir = { "mechanistic_phrase_tokenization" = "src" }
packages = ["mechanistic_phrase_tokenization"]
